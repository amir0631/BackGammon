[project]
name = "backgammon-backend"
version = "0.0.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DJ", "RUF"]
# RUF001: Persian and Arabic digits in i18n strings are intentional.
ignore = ["S101", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S107", "S311"]  # S311: seeded random drives test games
"settingsapp/registry.py" = ["E501"]  # one setting per line reads as a table

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["channels.*", "celery.*", "kombu.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["*.tests.*", "conftest"]
disallow_untyped_defs = false
disallow_untyped_calls = false
# State-machine tests assert a phase, act, then assert the next phase; mypy's narrowing flags that.
disable_error_code = ["comparison-overlap"]

[[tool.mypy.overrides]]
module = ["*.tasks"]
disallow_untyped_decorators = false

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
